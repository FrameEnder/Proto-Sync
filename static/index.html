<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proto-Sync</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2312161c'/><path d='M6 12h16l-4-4M26 20H10l4 4' stroke='%23f0a640' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-copy_lr" viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy_rl" viewBox="0 0 24 24"><path d="M20 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-delete_left" viewBox="0 0 24 24"><path d="M4 7h10M7 7V5h4v2M5.5 7l.8 12h7.4l.8-12M20 9l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-delete_right" viewBox="0 0 24 24"><path d="M10 7h10M13 7V5h4v2M10.5 7l.8 12h7.4l.8-12M4 9l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-move_right" viewBox="0 0 24 24"><path d="M4 16c0-5 4-8 9-8h6M15 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="19" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-move_left" viewBox="0 0 24 24"><path d="M20 16c0-5-4-8-9-8H5M9 4 5 8l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="19" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-equal" viewBox="0 0 24 24"><path d="M6 9h12M6 15h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="currentColor" opacity=".9"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M9 4v16M15 4v16M4 8h5M4 16h5M15 12h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4.5-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.2v.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17" cy="12" r="1.3" fill="currentColor"/><path d="M6.5 12h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <div class="brand" title="Proto-Sync">
      <svg class="brand-mark" viewBox="0 0 32 32"><path d="M5 12h17l-4.5-4.5M27 20H10l4.5 4.5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Proto-Sync</span>
    </div>

    <div class="job-picker">
      <button class="job-current" id="jobCurrent" aria-haspopup="menu">
        <span class="job-name" id="jobName">No job</span>
        <span class="job-variant" id="jobVariant"></span>
        <svg class="ico sm"><use href="#i-dots"/></svg>
      </button>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="compare" role="tab"><svg class="ico"><use href="#i-compare"/></svg><span>Compare</span></button>
      <button class="tab" data-view="schedule" role="tab"><svg class="ico"><use href="#i-clock"/></svg><span>Schedule</span></button>
      <button class="tab" data-view="history" role="tab"><svg class="ico"><use href="#i-history"/></svg><span>History</span></button>
      <button class="tab" data-view="settings" role="tab"><svg class="ico"><use href="#i-gear"/></svg><span>Settings</span></button>
    </nav>

    <button class="activity" id="activity" hidden>
      <span class="pulse"></span><span id="activityText">Running</span>
    </button>
  </header>

  <!-- ============================================================ COMPARE -->
  <main class="view" id="view-compare">
    <section class="commandbar">
      <div class="cmd-group">
        <button class="btn cmd" id="btnCompare" title="Compare (F5)"><svg class="ico"><use href="#i-compare"/></svg><span>Compare</span></button>
        <button class="btn icon-only" data-open-editor="compare" title="Comparison settings"><svg class="ico"><use href="#i-gear"/></svg></button>
      </div>
      <div class="cmd-group">
        <button class="btn icon-only" data-open-editor="filter" title="Filter settings"><svg class="ico"><use href="#i-filter"/></svg></button>
        <span class="cmd-filter-state" id="filterState"></span>
      </div>
      <div class="cmd-group">
        <button class="btn icon-only" data-open-editor="sync" title="Synchronization settings"><svg class="ico"><use href="#i-gear"/></svg></button>
        <div class="variant-switch" id="variantSwitch" role="radiogroup" aria-label="Sync variant">
          <button data-variant="mirror" title="Mirror: make the right side an exact copy of the left">Mirror</button>
          <button data-variant="update" title="Update: copy new and changed files to the right, never delete">Update</button>
          <button data-variant="two_way" title="Two way: propagate changes and deletions in both directions">Two way</button>
          <button data-variant="custom" title="Custom: choose the action for every category">Custom</button>
        </div>
        <button class="btn primary cmd" id="btnSync" title="Synchronize (F9)"><svg class="ico"><use href="#i-sync"/></svg><span>Synchronize</span></button>
      </div>
    </section>

    <section class="pairs" id="pairs"></section>

    <section class="viewbar">
      <div class="chips" id="catChips" aria-label="Show categories"></div>
      <div class="chips" id="actChips" aria-label="Show actions"></div>
      <label class="toggle-equal"><input type="checkbox" id="showEqual"> <span>Show identical</span></label>
      <div class="search">
        <svg class="ico sm"><use href="#i-search"/></svg>
        <input type="search" id="search" placeholder="Filter by path" autocomplete="off">
      </div>
    </section>

    <section class="grid" id="grid" tabindex="0" aria-label="Comparison result">
      <div class="grid-head">
        <div class="gh side left"><span>Left</span><span class="num">Size</span><span class="num">Modified</span></div>
        <div class="gh mid">Action</div>
        <div class="gh side right"><span>Right</span><span class="num">Size</span><span class="num">Modified</span></div>
      </div>
      <div class="grid-body" id="gridBody">
        <div class="grid-spacer" id="gridSpacer"></div>
        <div class="grid-rows" id="gridRows"></div>
      </div>
      <div class="grid-empty" id="gridEmpty"></div>
    </section>

    <footer class="statusbar" id="statusbar"></footer>
  </main>

  <!-- =========================================================== SCHEDULE -->
  <main class="view" id="view-schedule" hidden>
    <div class="page">
      <div class="page-head">
        <h1>Schedule</h1>
        <p class="lede">Every job's automatic triggers, when they fire next, and how the last run went.</p>
      </div>
      <div id="scheduleList" class="sched-list"></div>
    </div>
  </main>

  <!-- ============================================================ HISTORY -->
  <main class="view" id="view-history" hidden>
    <div class="page wide">
      <div class="page-head row">
        <div>
          <h1>History</h1>
          <p class="lede">Every run, manual or automatic. Open one to read its log and change tree.</p>
        </div>
        <select id="historyJob" class="input"><option value="">All jobs</option></select>
      </div>
      <div class="table-wrap"><table class="runs" id="runsTable"></table></div>
      <button class="btn ghost" id="historyMore">Load more</button>
    </div>
  </main>

  <!-- =========================================================== SETTINGS -->
  <main class="view" id="view-settings" hidden>
    <div class="page">
      <div class="page-head"><h1>Settings</h1></div>
      <div id="settingsBody"></div>
    </div>
  </main>

  <!-- ====================================================== RUN PANEL -->
  <aside class="runpanel" id="runpanel" hidden></aside>
</div>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="modal" id="modal"></dialog>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
